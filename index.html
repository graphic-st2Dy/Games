<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Menu</title>
    <style>
        :root {
            --bg-color: #121218;
            --card-bg: #1e1e28;
            --text-main: #f0f0f5;
            --text-muted: #a0a0b5;
            --accent-glow: rgba(138, 43, 226, 0.4);
            --accent-border: #8a2be2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top, #1f1f2e 0%, var(--bg-color) 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Header Style */
        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #b998fb, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        /* Grid Layout - 3 Columns */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        /* Game Card Styling */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 2px solid #333344;
            display: flex;
            flex-direction: column;
            cursor: none;
        }

        .game-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-border);
            box-shadow: 0 12px 24px var(--accent-glow);
        }

        /* Placeholder for a game thumbnail */
        .card-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #2a2a35 0%, #1a1a24 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid #121218;
            font-size: 2rem;
            color: var(--text-muted);
        }

        .card-content {
            padding: 20px;
        }

        .game-title {
            font-size: 1.4rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .game-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Responsive fallback for smaller screens */
        @media (max-width: 900px) {
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1><span style="font-size: 3.1rem;">B</span>rain-Game<span style="font-size: 3rem;">z</span></h1>
        <p class="subtitle">Select a game to start playing</p>
    </header>

    <main>
        <div class="game-grid">
            
            <a href="game1.html" class="game-card">
                <img src="game1_thumbnail.png" alt="thumbnail" style="width: 100%; height: 100%; object-fit: cover;">
                <div class="card-content">
                    <h2 class="game-title">Schulte Table</h2>
                    <p class="game-desc">Test your focus and reaction speed. Scan the square and tap the numbers in ascending order as fast as possible.</p>
                </div>
            </a>

            <a href="game2.html" class="game-card">
                <img src="game2_thumbnail.png" alt="thumbnail" style="width: 100%; height: 100%; object-fit: cover;">
                <div class="card-content">
                    <h2 class="game-title">Fit or Fail</h2>
                    <p class="game-desc">Test your precision by filling the bar with the exact block width needed.</p>
                </div>
            </a>

        </div>
    </main>

</body>
</html>
